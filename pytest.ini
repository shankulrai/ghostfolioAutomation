[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    regression: Regression test cases
    smoke: Smoke test cases
    ticket: Ticket ID marker
    priority_critical: Critical priority tests
    priority_high: High priority tests
    priority_medium: Medium priority tests
    priority_low: Low priority tests
    portfolio: Portfolio management tests
    fx: FX/currency tests
    api: API contract tests
    ui: UI component tests
